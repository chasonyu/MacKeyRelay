name: release

# On pushing a v* tag: build mackeyrelay for macOS targets and attach the
# prebuilt binaries to the GitHub Release. The npm package's postinstall
# script then downloads the matching asset per install machine.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset: darwin-arm64
          - runner: macos-latest
            target: x86_64-apple-darwin
            asset: darwin-x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Pack binary
        run: tar -czf mackeyrelay-${{ github.ref_name }}-${{ matrix.asset }}.tar.gz -C target/${{ matrix.target }}/release mackeyrelay

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: mackeyrelay-${{ github.ref_name }}-${{ matrix.asset }}.tar.gz
